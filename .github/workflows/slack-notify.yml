name: Slack Notification

on:
  workflow_call:
    inputs:
      result:
        required: true
        type: string
        description: "Overall job result: success, failure, or cancelled"
      environment:
        required: false
        type: string
        default: ""
        description: "Deployment environment (e.g. dev, prod)"
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    steps:
      - name: Gather info
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Status
          case "${{ inputs.result }}" in
            failure)  COLOR="#FF0000"; ICON="❌" ;;
            cancelled) COLOR="#FFA500"; ICON="⚠️" ;;
            *)        COLOR="#36A64F"; ICON="✅" ;;
          esac
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "icon=$ICON" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

          # Fetch commit message safely via API
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.commit.message' 2>/dev/null || echo "")
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -n1)

          # Extract merged branch and PR number
          MERGED=""
          PR=""
          if [[ "$FIRST_LINE" =~ Merge\ pull\ request\ \#([0-9]+)\ from\ [^/]+/(.+) ]]; then
            PR="${BASH_REMATCH[1]}"
            MERGED="${BASH_REMATCH[2]}"
          elif [[ "$FIRST_LINE" =~ Merge\ pull\ request\ \#([0-9]+) ]]; then
            PR="${BASH_REMATCH[1]}"
          elif [[ "$FIRST_LINE" =~ Merge\ branch\ \'([^\']+)\' ]]; then
            MERGED="${BASH_REMATCH[1]}"
          fi
          echo "merged=$MERGED" >> $GITHUB_OUTPUT
          echo "pr=$PR" >> $GITHUB_OUTPUT

          # Safe output for commit message via delimiter
          {
            echo "commit_msg<<EOFMSG"
            echo "$FIRST_LINE"
            echo "EOFMSG"
          } >> $GITHUB_OUTPUT

          # Pipeline duration
          STARTED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.run_started_at // empty' 2>/dev/null || echo "")
          if [[ -n "$STARTED" ]]; then
            START_TS=$(date -d "$STARTED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$STARTED" +%s 2>/dev/null || echo "")
            NOW_TS=$(date +%s)
            if [[ -n "$START_TS" ]]; then
              DIFF=$((NOW_TS - START_TS))
              MINS=$((DIFF / 60))
              SECS=$((DIFF % 60))
              echo "duration=${MINS}m ${SECS}s" >> $GITHUB_OUTPUT
            fi
          fi

          # Changed files count
          COMPARE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq '.files' 2>/dev/null || echo "")
          if [[ -n "$COMPARE" && "$COMPARE" != "null" ]]; then
            TOTAL=$(echo "$COMPARE" | jq 'length // 0')
            ADDED=$(echo "$COMPARE" | jq '[.[]? | select(.status=="added")] | length')
            REMOVED=$(echo "$COMPARE" | jq '[.[]? | select(.status=="removed")] | length')
            MODIFIED=$(echo "$COMPARE" | jq '[.[]? | select(.status=="modified" or .status=="renamed")] | length')
            echo "files=${TOTAL} files (+${ADDED} -${REMOVED} ~${MODIFIED})" >> $GITHUB_OUTPUT
          fi

      - name: Build and send notification
        env:
          SLACK_COMMIT_MSG: ${{ steps.info.outputs.commit_msg }}
        run: |
          # Build buttons array
          BUTTONS='[
            {"type":"button","text":{"type":"plain_text","text":"View Run"},"url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"},
            {"type":"button","text":{"type":"plain_text","text":"Commit"},"url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"}'

          PR="${{ steps.info.outputs.pr }}"
          if [[ -n "$PR" ]]; then
            BUTTONS="${BUTTONS},
            {\"type\":\"button\",\"text\":{\"type\":\"plain_text\",\"text\":\"PR #${PR}\"},\"url\":\"${{ github.server_url }}/${{ github.repository }}/pull/${PR}\"}"
          fi
          BUTTONS="${BUTTONS}]"

          # Build text with real newlines
          {
            echo "${{ steps.info.outputs.icon }} *${{ github.repository }}* — ${{ inputs.result }}${{ inputs.environment != '' && format(' ({0})', inputs.environment) || '' }}"
            echo "*Branch/Tag:* \`${{ github.ref_name }}\`"

            MERGED="${{ steps.info.outputs.merged }}"
            if [[ -n "$MERGED" ]]; then
              if [[ -n "$PR" ]]; then
                echo "*Merged:* \`${MERGED}\` (<${{ github.server_url }}/${{ github.repository }}/pull/${PR}|PR #${PR}>)"
              else
                echo "*Merged:* \`${MERGED}\`"
              fi
            elif [[ -n "$PR" ]]; then
              echo "*PR:* <${{ github.server_url }}/${{ github.repository }}/pull/${PR}|#${PR}>"
            fi

            echo "*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.info.outputs.short_sha }}> by ${{ github.actor }}"
            echo "*Message:* ${SLACK_COMMIT_MSG}"

            FILES="${{ steps.info.outputs.files }}"
            if [[ -n "$FILES" ]]; then
              echo "*Changes:* ${FILES}"
            fi

            DURATION="${{ steps.info.outputs.duration }}"
            if [[ -n "$DURATION" ]]; then
              echo "*Duration:* ${DURATION}"
            fi
          } > /tmp/slack_text.txt

          # Build payload via jq (safe JSON encoding)
          PAYLOAD=$(jq -nc \
            --arg color "${{ steps.info.outputs.color }}" \
            --arg text "$(cat /tmp/slack_text.txt)" \
            --argjson buttons "$BUTTONS" \
            '{
              "attachments": [{
                "color": $color,
                "blocks": [
                  {"type":"section","text":{"type":"mrkdwn","text":$text}},
                  {"type":"actions","elements":$buttons}
                ]
              }]
            }')

          # Send to Slack
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
